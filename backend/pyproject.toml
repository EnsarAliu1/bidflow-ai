[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidflow-api"
version = "0.1.0"
description = "FastAPI backend for BidFlow AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]